[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "flycan"
version = "0.1.0"
description = "Can detection and FlyWire-subgraph PPO navigation experiments"
requires-python = ">=3.11"
dependencies = ["torch", "torchvision", "stable-baselines3", "ultralytics", "pandas", "pyarrow", "pillow", "requests"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
[tool.setuptools.package-data]
flycan = ["web/*.html", "web/*.js", "web/*.css"]
